name: Deploy playable prologue

on:
  push:
    branches: [main]
    paths:
      - 'site-*.zip'
      - 'SHA256SUMS'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify release packages
        run: sha256sum -c SHA256SUMS
      - name: Unpack exported Ren'Py website
        run: |
          mkdir site
          unzip -q site-1.zip -d site
          unzip -q site-2.zip -d site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish playable prologue
        id: deployment
        uses: actions/deploy-pages@v4
